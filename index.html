<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A colorful animated math quiz app for Myra to learn multiplication, addition, subtraction and division">
    <title>Myra's Math Quest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔢 Myra's Math Quest 🔢</h1>
            <p class="subtitle">Learn Math the Fun Way!</p>
        </header>

        <main>
            <!-- Quiz Type Selection -->
            <div id="quiz-menu" class="quiz-menu">
                <p class="menu-title">Choose a Quiz! 🎯</p>
                <button class="quiz-type-btn multiply-btn" data-type="multiplication">
                    ✖️ Multiplication
                </button>
                <button class="quiz-type-btn add-btn" data-type="addition">
                    ➕ Addition
                </button>
                <button class="quiz-type-btn subtract-btn" data-type="subtraction">
                    ➖ Subtraction
                </button>
                <button class="quiz-type-btn divide-btn" data-type="division">
                    ➗ Division
                </button>
            </div>

            <!-- Quiz Container -->
            <div id="quiz-container" style="display: none;">
                <!-- Score and Question Display -->
                <div class="stats-bar">
                    <div class="stat">
                        <span id="question-number" class="stat-label">Question 1 of 10</span>
                    </div>
                    <div class="stat">
                        <span id="score" class="stat-value">✅ 0 / 10</span>
                    </div>
                </div>

                <!-- Equation Display -->
                <div class="equation-area">
                    <div class="equation-display">
                        <span id="num1" class="number">10</span>
                        <span id="operator" class="operator">×</span>
                        <span id="num2" class="number">10</span>
                        <span class="operator">=</span>
                        <span id="result" class="number result">?</span>
                    </div>
                </div>

                <!-- Block Animation Area -->
                <div id="blocks-container" class="blocks-container">
                    <!-- Animated blocks will appear here -->
                </div>

                <!-- Answer Buttons -->
                <div class="answer-buttons" id="answer-buttons">
                    <!-- Answer buttons will be generated here -->
                </div>

                <!-- Feedback Message -->
                <div id="feedback" class="feedback"></div>

                <!-- Controls -->
                <div class="controls">
                    <button id="show-answer-btn" class="control-btn show-btn">
                        👀 Show Answer
                    </button>
                    <button id="next-btn" class="control-btn next-btn" style="display: none;">
                        ➡️ Next Question
                    </button>
                </div>

                <!-- Navigation Buttons -->
                <div class="nav-buttons">
                    <button class="nav-btn home-btn" onclick="location.reload()">
                        🏠 Home
                    </button>
                </div>
            </div>

            <!-- Results Container -->
            <div id="results-container" style="display: none;">
                <!-- Navigation Buttons -->
                <div class="nav-buttons">
                    <button class="nav-btn home-btn" onclick="location.reload()">
                        🏠 Home
                    </button>
                </div>

                <div class="results-screen">
                    <div class="results-emoji" id="results-emoji">🏆</div>
                    <h2 class="results-message" id="results-message">AMAZING!</h2>
                    <div class="stars-grid" id="stars-grid">
                        <!-- Individual star emojis rendered by JS -->
                    </div>
                    <div class="results-text" id="results-text">Myra got 10 stars!</div>
                    <button id="play-again-btn" class="start-quiz-btn" onclick="location.reload()">
                        🎮 Play Again!
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <p>Made with 💖 for Myra</p>
        </footer>
    </div>

    <!-- Celebration Animation -->
    <div id="celebration" class="celebration"></div>

    <script src="script.js"></script>
</body>
</html>
